<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 52px;
  overflow: hidden;
  background: transparent;
  font-family: Tahoma, Arial, sans-serif;
}

.ticker {
  width: 100%;
  height: 52px;
  display: flex;
  align-items: center;
  background: linear-gradient(90deg, #087f91, #164b70);
  color: white;
  overflow: hidden;
  border-radius: 8px;
}

.ticker-title {
  flex-shrink: 0;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0 18px;
  background: #123b56;
  color: white;
  font-size: 17px;
  font-weight: bold;
  z-index: 2;
}

.ticker-content {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  direction: rtl;
}

.ticker-text {
  display: inline-block;
  white-space: nowrap;
  padding-right: 100%;
  animation: moveTicker 55s linear infinite;
  font-size: 16px;
  font-weight: bold;
}

.ticker-text span {
  margin: 0 28px;
}

@keyframes moveTicker {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(100%);
  }
}
</style>
</head>

<body>

<div class="ticker">

  <div class="ticker-title">
    🟢 مؤشرات الأداء
  </div>

  <div class="ticker-content">
    <div class="ticker-text">

      <span>🏆 أعلى نسبة إجادة في الصف الخامس: 80%</span>

      <span>📉 أعلى نسبة تدني في الصف العاشر: 6.43</span>

      <span>📊 المتوسط الحسابي: 75.34</span>

      <span>📍 أعلى نسبة تدني في ولايتي الخابورة وصحم</span>

      <span>⭐ أعلى متوسط حسابي في مادة التربية الإسلامية</span>

      <span>📘 أدنى متوسط حسابي في مادة الرياضيات</span>

      <span>🏫 أعلى متوسط حسابي في مدرسة جوهرة شناص للبنات</span>

    </div>
  </div>

</div>

</body>
</html>
