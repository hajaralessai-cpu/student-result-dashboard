 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 52px;
  overflow: hidden;
  background: transparent;
  font-family: Tahoma, Arial, sans-serif;
}

.ticker {
  display: flex;
  width: 100%;
  height: 52px;
  overflow: hidden;
  align-items: center;
  border-radius: 8px;
  background: linear-gradient(90deg, #087f91, #164b70);
  color: white;
}

.ticker-title {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  height: 100%;
  padding: 0 16px;
  background: #123b56;
  font-size: 16px;
  font-weight: bold;
  white-space: nowrap;
  z-index: 2;
}

.ticker-window {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: center;
  overflow: hidden;
  direction: rtl;
}

.ticker-track {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  width: max-content;
  white-space: nowrap;
  animation: tickerMove 45s linear infinite;
  will-change: transform;
}

.ticker-item {
  display: inline-block;
  flex-shrink: 0;
  padding: 0 22px;
  font-size: 16px;
  font-weight: bold;
  color: #ffffff;
}

.ticker-item::after {
  content: " ✦ ";
  color: #74e4e2;
  padding-right: 25px;
}

@keyframes tickerMove {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(100%);
  }
}

@media (prefers-reduced-motion: reduce) {
  .ticker-track {
    animation: none;
  }
}
</style>
</head>

<body>

<div class="ticker">

  <div class="ticker-title">
    🟢 مؤشرات الأداء
  </div>

  <div class="ticker-window">

    <div class="ticker-track">

      <span class="ticker-item">
        🏆 أعلى نسبة إجادة في الصف الخامس: 80%
      </span>

      <span class="ticker-item">
        📉 أعلى نسبة تدني في الصف العاشر: 6.43
      </span>

      <span class="ticker-item">
        📊 المتوسط الحسابي: 75.34
      </span>

      <span class="ticker-item">
        📍 أعلى نسبة تدني في ولايتي الخابورة وصحم
      </span>

      <span class="ticker-item">
        ⭐ أعلى متوسط حسابي في مادة التربية الإسلامية
      </span>

      <span class="ticker-item">
        📘 أدنى متوسط حسابي في مادة الرياضيات
      </span>

      <span class="ticker-item">
        🏫 أعلى متوسط حسابي في مدرسة جوهرة شناص للبنات
      </span>

    </div>

  </div>

</div>

</body>
</html>
